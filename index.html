<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1418">
<title>Nikom Home | วิดีโอสาธิตระบบสมาร์ทโฮม</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1418'/%3E%3Cpath d='M12 29L32 12l20 17v24H38V37H26v16H12z' fill='%2356ded2'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}:root{color-scheme:dark;--canvas:#0b1418;--glow:oklch(.3 .05 190/.5);--text:#f0f8f8;--text-2:#a1b7bf;--text-3:#829ca5;--line:#24474b;--accent:#5de0d3;--accent-hover:#8aece2;--on-accent:#09221f;--quiet:#173237;--quiet-hover:#1e4148;--quiet-line:#39636a;--muted:oklch(.83 .12 75);--danger:oklch(.72 .15 25)}::selection{background:var(--accent);color:var(--on-accent)}body{margin:0;min-height:100svh;background:radial-gradient(70% 520px at 50% 0,var(--glow),transparent) no-repeat,var(--canvas);color:var(--text);font-family:Tahoma,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h1{font-size:22px;letter-spacing:.03em;margin:0}header p{font-size:14px;color:var(--text-2);margin:6px 0 0}.tag{border:1px solid #34535b;border-radius:6px;padding:7px 10px;font-size:13px;white-space:nowrap;color:#a8dad5;font-variant-numeric:tabular-nums}.player{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 18px 50px -12px rgba(0,0,0,.7)}video{width:100%;display:block;aspect-ratio:16/9;max-height:75svh;background:#000}button{font-family:inherit;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s,transform .1s}button:active{transform:scale(.97)}#play{position:absolute;inset:0;margin:auto;width:150px;height:54px;font-size:17px;background:var(--accent);color:var(--on-accent);border:0;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.45)}#play:hover{background:var(--accent-hover)}#play[hidden]{display:none}.below{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px 24px;margin-top:18px}.audio{display:flex;align-items:center;gap:16px;min-width:0}#sound{flex:none;background:var(--quiet);color:#affcf2;border:1px solid var(--quiet-line);border-radius:8px;padding:12px 20px;font-size:16px}#sound:hover{background:var(--quiet-hover);border-color:#4f8189}#sound[aria-pressed=false]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}#sound[aria-pressed=false]:hover{background:var(--accent-hover);border-color:var(--accent-hover)}#status{display:flex;align-items:center;gap:9px;font-size:14px;line-height:1.6;color:var(--text-2);margin:0}#status::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--text-3)}#status[data-state=muted]::before{background:var(--muted)}#status[data-state=sound]::before{background:var(--accent);box-shadow:0 0 0 3px oklch(.85 .12 185/.2)}#status[data-state=error]{color:var(--danger)}#status[data-state=error]::before{background:var(--danger)}a{color:#b8ddd9;font-size:14px;text-underline-offset:4px;white-space:nowrap}a:hover{color:var(--accent)}.download{display:inline-block;padding:12px 0}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}.help{font-size:14px;color:var(--text-3);line-height:1.7;margin:12px 0 18px}@media(max-width:600px){main{padding:18px 12px}h1{font-size:20px}header{align-items:flex-start;margin-bottom:18px}.tag{font-size:12px;padding:6px 8px}.below{gap:6px 16px}.audio{flex:1 1 100%}video{max-height:70svh}.player{border-radius:8px}.help{margin-top:4px}}@media(prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
</style></head>
<body><main><header><div><h1>Nikom Home</h1><p>วิดีโอสาธิตระบบสมาร์ทโฮม</p></div><span class="tag">1080p · 2:37</span></header>
<div class="player"><video id="video" controls autoplay muted playsinline preload="auto"><source src="smart-home-demo.mp4" type="video/mp4">เบราว์เซอร์นี้ไม่รองรับวิดีโอ กรุณาดาวน์โหลดไฟล์ MP4 ด้านล่าง</video><button id="play" type="button" hidden>เล่นวิดีโอ</button></div>
<div class="below"><div class="audio"><button id="sound" type="button">เปิดเสียง</button><p id="status" role="status" data-state="idle">กำลังโหลดวิดีโอ…</p></div><a class="download" href="smart-home-demo.mp4" download>ดาวน์โหลดวิดีโอ</a></div><p class="help">แตะปุ่มเต็มจอในวิดีโอเพื่อดูรายละเอียด</p></main>
<script>
const video=document.getElementById('video'),play=document.getElementById('play'),sound=document.getElementById('sound'),status=document.getElementById('status');
function audioLabel(){sound.textContent=video.muted?'เปิดเสียง':'ปิดเสียง';sound.setAttribute('aria-pressed',String(!video.muted));}
function say(text,state){status.textContent=text;status.dataset.state=state;}
function message(){if(video.ended)say('เล่นวิดีโอจบแล้ว','idle');else if(video.paused)say('แตะเล่นเพื่อชมวิดีโอ','idle');else if(video.muted)say('กำลังเล่นแบบปิดเสียง','muted');else say('กำลังเล่นพร้อมเสียง','sound');}
async function start(){try{await video.play();play.hidden=true;message()}catch{play.hidden=false;say('แตะเล่นเพื่อชมวิดีโอ','idle');}}
sound.onclick=()=>{video.muted=!video.muted;audioLabel();if(video.paused)start();else message()};play.onclick=()=>{video.muted=false;audioLabel();start()};
video.addEventListener('playing',()=>{play.hidden=true;play.textContent='เล่นวิดีโอ';message()});video.addEventListener('pause',message);video.addEventListener('ended',()=>{play.textContent='เล่นอีกครั้ง';play.hidden=false;message()});video.addEventListener('volumechange',()=>{audioLabel();message()});video.addEventListener('waiting',()=>say('กำลังโหลดวิดีโอ…','idle'));video.addEventListener('error',()=>{say('เปิดวิดีโอไม่สำเร็จ ลองกดดาวน์โหลดวิดีโอแทน','error');play.hidden=true},true);audioLabel();start();
</script></body></html>
